const viewer = document.getElementById("viewer");
const imgThen = document.getElementById("img-then");
const imgNow = document.getElementById("img-now");
const nowWrap = document.getElementById("nowwrap");
const fx = document.getElementById("fx");
const handle = document.getElementById("handle");
const caption = document.getElementById("caption");
const timeline = document.getElementById("timeline");
const tagThen = document.getElementById("tag-then");
const CREDITS = "Charts: Wikimedia Commons, Bibliothèque nationale de France, Rijksmuseum (CC0), UK Hydrographic Office (public domain) · Satellite image: NASA (public domain) · Full credits per chart in each caption";
document.getElementById("credits").textContent = CREDITS;

let idx = 0;
let pos = 55;

/* object-position for the satellite layer per scene, so the "now" crop
   frames the same stretch of coast the old chart shows (image % coords) */
const NOW_POS = {
  zara1530: "50% 90%", metellus1579: "50% 90%", bianco1600: "50% 90%",
  zara1806: "50% 90%", zara1877: "50% 90%",
  ragusa1560: "50% 100%", bellin1764: "50% 100%",
  jansson1657: "50% 95%", isole1697: "50% 95%", sduk1852: "50% 95%", boschini: "50% 95%",
  quarnero1700: "50% 55%", admiralty1877: "50% 55%",
  mercator1609: "50% 72%", blaeu1645: "50% 72%", blaeu1663: "50% 72%",
  cantelli1680: "50% 75%", illyria1817: "50% 72%", keulen1750: "50% 65%",
  now: "50% 65%"
};

function yearNum(s) {
  const m = s.year.match(/\d{3,4}/);
  if (m) return parseInt(m[0], 10);
  if (/18th/.test(s.year)) return 1750;
  return 2003;
}
function pct(y) { return Math.max(3, Math.min(97, (y - 1500) / (2003 - 1500) * 100)); }

const tlFill = document.createElement("div"); tlFill.className = "tl-fill";
const tlTicks = document.createElement("div"); tlTicks.className = "tl-ticks";
timeline.appendChild(tlFill);
timeline.appendChild(tlTicks);
[1600, 1700, 1800, 1900, 2000].forEach(c => {
  const t = document.createElement("span");
  t.style.left = pct(c) + "%";
  t.innerHTML = "<i>" + c + "</i>";
  tlTicks.appendChild(t);
});

SCENES.forEach((s, i) => {
  const b = document.createElement("button");
  b.className = "chip";
  b.innerHTML = '<span class="dot"></span><span class="lab">' + s.label + "</span>";
  b.title = s.year + " — " + s.title;
  b.dataset.i = i;
  b.style.left = pct(yearNum(s)) + "%";
  b.setAttribute("role", "tab");
  b.onclick = () => show(i);
  timeline.appendChild(b);
});

const reduceMotion = typeof window.matchMedia === "function" && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let lastY = yearNum(SCENES[0]);
function countUp(el, fromY, toY, finalLabel) {
  if (reduceMotion || Math.abs(toY - fromY) < 1) { el.textContent = finalLabel; return; }
  const t0 = performance.now(), dur = 550;
  (function step(t) {
    const k = Math.min(1, (t - t0) / dur);
    el.textContent = Math.round(fromY + (toY - fromY) * k);
    if (k < 1) requestAnimationFrame(step); else el.textContent = finalLabel;
  })(t0);
}

function updateHash() {
  const h = "#chart=" + SCENES[idx].id + "&pos=" + Math.round(pos);
  history.replaceState(null, "", h);
}

function show(i) {
  idx = (i + SCENES.length) % SCENES.length;
  const s = SCENES[idx];
  viewer.classList.add("switching");
  caption.classList.add("switching");
  setTimeout(() => {
    viewer.classList.toggle("solo", !!s.solo);
    if (s.solo) {
      imgThen.src = imgNow.src;
      imgThen.alt = "NASA satellite view of the Adriatic";
      setPos(pos, false);
    } else {
      imgThen.src = s.img;
      imgThen.alt = s.title + " (" + s.author + ")";
      setPos(pos, true);
    }
    const y = yearNum(s);
    const label = s.solo ? "Now" : s.year;
    imgNow.style.objectPosition = NOW_POS[s.id] || "50% 72%";
    caption.innerHTML =
      "<span class='stamp'>" + label + "</span>" +
      "<h2>" + s.title + "</h2>" +
      "<div class='meta'>" + s.author + " · " + s.yearLabel + "</div>" +
      "<p>" + s.text + "</p>" +
      (s.more ? "<p>" + s.more + "</p>" : "") +
      "<a class='src' href='" + s.page + "' target='_blank' rel='noopener'>" + s.src + "</a>";
    const stamp = caption.querySelector(".stamp");
    if (s.solo) { tagThen.textContent = "Now"; if (stamp) stamp.textContent = "Now"; }
    else {
      countUp(tagThen, lastY, y, label);
      if (stamp) countUp(stamp, lastY, y, label);
    }
    lastY = y;
    tlFill.style.width = pct(y) + "%";
    [...timeline.querySelectorAll(".chip")].forEach((c, j) => c.classList.toggle("active", j === idx));
    const active = timeline.querySelectorAll(".chip")[idx];
    if (active) active.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
    viewer.classList.remove("switching");
    caption.classList.remove("switching");
    updateHash();
  }, 170);
}

function setPos(p, animate) {
  pos = Math.max(2, Math.min(98, p));
  viewer.classList.toggle("ease", !!animate);
  handle.style.left = pos + "%";
  nowWrap.style.clipPath = "inset(0 0 0 " + pos + "%)";
  fx.style.clipPath = "inset(0 " + (100 - pos) + "% 0 0)";
  viewer.setAttribute("aria-valuenow", Math.round(pos));
  updateHash();
}

imgThen.addEventListener("load", () => viewer.classList.add("loaded"));

let dragging = false;
function posFromEvent(e) {
  const r = viewer.getBoundingClientRect();
  return ((e.clientX - r.left) / r.width) * 100;
}
viewer.addEventListener("pointerdown", e => {
  if (SCENES[idx].solo) return;
  dragging = true;
  viewer.classList.add("touched");
  if (viewer.setPointerCapture) viewer.setPointerCapture(e.pointerId);
  setPos(posFromEvent(e), false);
  e.preventDefault();
});
viewer.addEventListener("pointermove", e => { if (dragging) setPos(posFromEvent(e), false); });
viewer.addEventListener("pointerup", () => dragging = false);
viewer.addEventListener("pointercancel", () => dragging = false);

viewer.addEventListener("keydown", e => {
  if (SCENES[idx].solo) return;
  if (e.key === "ArrowLeft") { setPos(pos - 3, false); e.preventDefault(); }
  if (e.key === "ArrowRight") { setPos(pos + 3, false); e.preventDefault(); }
  if (e.key === "Home") { setPos(2, false); e.preventDefault(); }
  if (e.key === "End") { setPos(98, false); e.preventDefault(); }
});
window.addEventListener("keydown", e => {
  if (e.target === viewer) return;
  if (e.key === "ArrowLeft") show(idx - 1);
  if (e.key === "ArrowRight") show(idx + 1);
});

document.getElementById("prev").onclick = () => show(idx - 1);
document.getElementById("next").onclick = () => show(idx + 1);

const copyBtn = document.getElementById("copy");
copyBtn.onclick = async () => {
  try {
    await navigator.clipboard.writeText(location.href);
  } catch (err) {
    const t = document.createElement("textarea");
    t.value = location.href;
    document.body.appendChild(t);
    t.select();
    document.execCommand("copy");
    t.remove();
  }
  const old = copyBtn.textContent;
  copyBtn.textContent = "Copied";
  setTimeout(() => { copyBtn.textContent = old; }, 1600);
};

const m = location.hash.match(/chart=([\w-]+)/);
const pm = location.hash.match(/pos=(\d+)/);
const start = m ? SCENES.findIndex(s => s.id === m[1]) : 0;
if (pm) pos = Math.max(2, Math.min(98, parseInt(pm[1], 10)));
setPos(pos, false);
show(start < 0 ? 0 : start);
</script>
</body>
